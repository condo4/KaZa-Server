[ssl]
port=1754
keypassword="keypassword"
hostname="home.kazoe.org"

[control]
port=43500
password="password"
enable=true

[database]
driver="QPSQL"
hostname="127.0.0.1"
port=5432
dbName="kaza"
username="kaza"
password="dbpass"

[qml]
server=/mnt/Data/Projects/KaZaTrespeyres/Server/main.qml
client=/mnt/Data/Projects/KaZaTrespeyres/Client/app.rcc

# Optionnel : limites du moteur de services (KzService), valeurs par défaut ci-dessous
[services]
workers=2        # connexions SQL de service (threads)
maxInFlight=8    # requêtes simultanées par connexion cliente
queueLimit=256   # requêtes en attente, toutes connexions confondues
